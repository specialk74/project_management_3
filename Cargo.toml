[package]
name = "project_management_app_2"
version = "0.23.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
rfd = "0.17.2"
eframe = "0.37.0"
# Dipendenza diretta solo per l'opzione `monochrome_emoji_fonts` (stessa versione
# di eframe, cargo unisce le opzioni): da egui 0.37 i font con simboli ed emoji
# (NotoEmoji, emoji-icon-font) non sono più caricati di default e servono per le
# icone dell'interfaccia (ℹ ⚠ ⛔ ✔ ⚑ ⚡ ⌘ 🔎 🗑).
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", features = ["datepicker"] }
jiff = "0.2.23"
printpdf = "0.12.8"
# Già presente fra le dipendenze di egui (stessa versione): serve per misurare
# la larghezza vera dei testi nel PDF della matrice (celle strette).
ttf-parser = "0.25.1"
egui_commonmark = { version = "0.26.0", default-features = false, features = [
    "pulldown_cmark",
] }
